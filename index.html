<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Juri's 30 Day — A premium 30-day discipline and lifestyle challenge tracker.">
  <meta name="theme-color" content="#ff69b4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Juri's 30 Day">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23ff69b4' width='180' height='180'/><text x='90' y='110' font-size='80' font-weight='bold' text-anchor='middle' fill='white'>🌸</text></svg>">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' font-size='50' dominant-baseline='middle' text-anchor='middle'>🌸</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <title>Juri's 30 Day</title>
</head>
<body>
  <div id="app">
    <div id="app-main">
      <!-- Views render here -->
    </div>

    <nav class="nav-bar" role="navigation" aria-label="Main navigation">
      <button class="nav-tab" data-view="home">
        <span style="font-size: 1.25rem">🏠</span>
      </button>
      <button class="nav-tab" data-view="calendar">
        <span style="font-size: 1.25rem">📅</span>
      </button>
      <button class="nav-tab" data-view="statistics">
        <span style="font-size: 1.25rem">📊</span>
      </button>
      <button class="nav-tab" data-view="progress">
        <span style="font-size: 1.25rem">📈</span>
      </button>
      <button class="nav-tab" data-view="profile">
        <span style="font-size: 1.25rem">👤</span>
      </button>
    </nav>
  </div>

  <div id="daily-message" style="display: none;"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
